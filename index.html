<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>OCR Inteligente Contable</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tesseract -->
  <script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>

    body{
      background:#f3f4f6;
    }

    .loader{

      border:6px solid #e5e7eb;
      border-top:6px solid #16a34a;

      border-radius:50%;

      width:70px;
      height:70px;

      animation:spin 1s linear infinite;
    }

    @keyframes spin{

      100%{

        transform:rotate(360deg);
      }
    }

  </style>

</head>

<body class="p-8">

  <div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-2xl p-8">

    <!-- TITULO -->

    <div class="mb-10">

      <h1 class="text-5xl font-bold text-green-700">
        Sistema OCR Contable
      </h1>

      <p class="text-gray-600 mt-3 text-lg">
        Automatización inteligente de comprobantes de egreso
      </p>

    </div>

    <!-- INPUT -->

    <div class="bg-gray-50 p-6 rounded-2xl border mb-8">

      <input
        type="file"
        id="imagenInput"
        accept="image/*"
        class="w-full border rounded-xl p-4 mb-5 bg-white"
      />

      <button
        onclick="procesarDocumento()"
        class="bg-green-600 hover:bg-green-700 text-white font-bold px-8 py-4 rounded-2xl text-lg"
      >
        Procesar Documento
      </button>

    </div>

    <!-- LOADING -->

    <div
      id="loading"
      class="hidden text-center mb-10"
    >

      <div class="loader mx-auto"></div>

      <p class="mt-5 text-lg font-bold text-gray-700">
        Analizando documento...
      </p>

    </div>

    <!-- RESULTADOS -->

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">

      <div class="bg-blue-50 border border-blue-200 p-6 rounded-2xl">

        <h2 class="font-bold text-xl text-blue-800 mb-3">
          Empresa
        </h2>

        <p
          id="empresa"
          class="text-2xl font-bold text-blue-700"
        >
          -
        </p>

      </div>

      <div class="bg-purple-50 border border-purple-200 p-6 rounded-2xl">

        <h2 class="font-bold text-xl text-purple-800 mb-3">
          Fecha
        </h2>

        <p
          id="fecha"
          class="text-2xl font-bold text-purple-700"
        >
          -
        </p>

      </div>

      <div class="bg-green-50 border border-green-200 p-6 rounded-2xl">

        <h2 class="font-bold text-xl text-green-800 mb-3">
          Valor Total
        </h2>

        <p
          id="valor"
          class="text-3xl font-bold text-green-700"
        >
          -
        </p>

      </div>

      <div class="bg-orange-50 border border-orange-200 p-6 rounded-2xl">

        <h2 class="font-bold text-xl text-orange-800 mb-3">
          NIT
        </h2>

        <p
          id="nit"
          class="text-2xl font-bold text-orange-700"
        >
          -
        </p>

      </div>

    </div>

    <!-- TEXTO OCR -->

    <div>

      <h2 class="text-3xl font-bold mb-5">
        Texto Detectado
      </h2>

      <textarea
        id="textoOCR"
        class="w-full h-[450px] border rounded-2xl p-5 text-sm"
      ></textarea>

    </div>

  </div>

  <script>

    async function procesarDocumento(){

      try{

        // ======================================
        // LOADING
        // ======================================

        document
        .getElementById("loading")
        .classList
        .remove("hidden");

        // ======================================
        // ARCHIVO
        // ======================================

        const archivo =
        document
        .getElementById("imagenInput")
        .files[0];

        if(!archivo){

          alert(
            "Selecciona una imagen"
          );

          return;
        }

        // ======================================
        // CARGAR IMAGEN
        // ======================================

        const imageURL =
        URL.createObjectURL(archivo);

        const img =
        new Image();

        img.src = imageURL;

        await new Promise(resolve => {

          img.onload = resolve;
        });

        // ======================================
        // CANVAS
        // ======================================

        const canvas =
        document.createElement("canvas");

        const ctx =
        canvas.getContext("2d");

        // ESCALA X2
        canvas.width =
        img.width * 2;

        canvas.height =
        img.height * 2;

        ctx.drawImage(

          img,

          0,
          0,

          canvas.width,
          canvas.height
        );

        // ======================================
        // PREPROCESAMIENTO
        // ======================================

        const imageData =
        ctx.getImageData(

          0,
          0,

          canvas.width,
          canvas.height
        );

        const data =
        imageData.data;

        for(

          let i = 0;

          i < data.length;

          i += 4
        ){

          // ESCALA DE GRISES
          const gris =

          (
            data[i]
            +
            data[i+1]
            +
            data[i+2]
          ) / 3;

          // CONTRASTE FUERTE
          const valor =
          gris > 150 ? 255 : 0;

          data[i] = valor;
          data[i+1] = valor;
          data[i+2] = valor;
        }

        ctx.putImageData(
          imageData,
          0,
          0
        );

        // ======================================
        // OCR
        // ======================================

        const resultado =
        await Tesseract.recognize(

          canvas,

          "spa",

          {

            logger: m => {

              console.log(m);
            }
          }
        );

        const texto =
        resultado.data.text;

        // ======================================
        // MOSTRAR OCR
        // ======================================

        document
        .getElementById("textoOCR")
        .value = texto;

        // ======================================
        // LIMPIEZA
        // ======================================

        const textoLimpio =

        texto
        .replace(/\n/g," ")
        .replace(/\s+/g," ")
        .trim();

        // ======================================
        // LINEAS
        // ======================================

        const lineas =
        texto.split("\n");

        // ======================================
        // FECHA
        // ======================================

        let fechaFinal =
        "No detectada";

        const regexFecha =

        /\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/;

        const fecha =
        textoLimpio.match(regexFecha);

        if(fecha){

          fechaFinal =
          fecha[0];
        }

        // ======================================
        // NIT
        // ======================================

        let nitFinal =
        "No detectado";

        const regexNit =

        /\d{3}\.?\d{3}\.?\d{3}/;

        const nit =
        textoLimpio.match(regexNit);

        if(nit){

          nitFinal =
          nit[0];
        }

        // ======================================
        // EMPRESA
        // ======================================

        let empresaFinal =
        "No detectada";

        for(let linea of lineas){

          linea =
          linea.trim();

          if(

            linea.length > 5

            &&

            linea === linea.toUpperCase()

            &&

            !linea.includes("NIT")

            &&

            !linea.includes("COMPROBANTE")

            &&

            !linea.includes("FECHA")

            &&

            !linea.includes("VALOR")
          ){

            empresaFinal =
            linea;

            break;
          }
        }

        // ======================================
        // VALOR INTELIGENTE
        // ======================================

        let valorFinal = 0;

        // PRIORIDADES
        const prioridades = [

          "TOTAL COMPROBANTE",
          "VALOR TOTAL",
          "TOTAL PAGADO",
          "TOTAL",
          "VALOR",
          "POR VALOR",
          "PÁGUESE A",
          "PAGUESE A"
        ];

        // ======================================
        // BUSCAR POR PRIORIDAD
        // ======================================

        for(let prioridad of prioridades){

          for(let linea of lineas){

            const lineaMayus =

            linea.toUpperCase();

            if(

              lineaMayus.includes(prioridad)
            ){

              // EXTRAER NUMEROS
              const encontrados =

              linea.match(

                /\d{1,3}(?:[\.\,]\d{3})+/g
              );

              if(encontrados){

                const numeros =

                encontrados.map(n => {

                  return parseInt(

                    n
                    .replace(/\./g,"")
                    .replace(/\,/g,"")
                  );
                });

                // TOMAR MAYOR
                const mayor =
                Math.max(...numeros);

                if(mayor > valorFinal){

                  valorFinal = mayor;
                }
              }
            }
          }

          // SI YA ENCONTRO
          if(valorFinal > 0){

            break;
          }
        }

        // ======================================
        // RESPALDO
        // ======================================

        if(valorFinal === 0){

          const numeros =

          textoLimpio.match(

            /\d{1,3}(?:[\.\,]\d{3})+/g
          );

          if(numeros){

            const convertidos =

            numeros.map(n => {

              return parseInt(

                n
                .replace(/\./g,"")
                .replace(/\,/g,"")
              );
            });

            // FILTRAR VALORES PEQUEÑOS
            const grandes =

            convertidos.filter(

              n => n > 10000
            );

            if(grandes.length > 0){

              valorFinal =
              Math.max(...grandes);
            }
          }
        }

        // ======================================
        // VALIDACION EXTRA
        // ======================================

        if(valorFinal > 999999999){

          valorFinal = 0;
        }

        // ======================================
        // MOSTRAR RESULTADOS
        // ======================================

        document
        .getElementById("empresa")
        .innerText =
        empresaFinal;

        document
        .getElementById("fecha")
        .innerText =
        fechaFinal;

        document
        .getElementById("nit")
        .innerText =
        nitFinal;

        document
        .getElementById("valor")
        .innerText =

        valorFinal > 0

        ?

        "$ " +

        valorFinal.toLocaleString(
          "es-CO"
        )

        :

        "No detectado";

        // ======================================
        // FINALIZAR
        // ======================================

        document
        .getElementById("loading")
        .classList
        .add("hidden");

      }catch(error){

        console.log(error);

        alert(
          "Error al procesar documento"
        );

        document
        .getElementById("loading")
        .classList
        .add("hidden");
      }
    }

  </script>

</body>
</html>
